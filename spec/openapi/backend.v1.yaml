openapi: 3.0.3
info:
  title: HOPA backend
  version: "1.0"
  description: |
    The coordination service: pairing, tokens, trace lookup and the WebSocket
    gateway that routes task messages between one household's devices.

    The backend never decides a step and never executes a device command. It
    carries task messages, stores their state, wakes a sleeping device and
    records where every message went.

    Identity is never on the wire. `household_id` is derived from the access
    token; a body that names another household is ignored, and a `to` device
    outside the caller's household is refused with `E_TENANT`.

    The gateway frames are defined by
    `contracts/schemas/gateway.v1.schema.json` and replayed from
    `contracts/fixtures/gateway-v0.json`; this file covers the HTTP surface.
servers:
  - url: https://hopa-backend.onrender.com
    description: EU deployment (Render, Frankfurt)
  - url: http://127.0.0.1:8080
    description: Local
security:
  - bearerAuth: []
# The WebSocket surface is defined by contracts/schemas/gateway.v1.schema.json
# and its fixtures, not by OpenAPI. The path is declared so the route/spec check
# knows it exists.
x-path-prefixes:
  - /v1/gateway
paths:
  /v1/health:
    get:
      summary: Liveness and readiness
      description: |
        Unauthenticated. Reports database state and queue depth so a deploy can
        gate on it. Answers 200 while the database is reachable (`ok`, or
        `unconfigured` before a database is wired up) and 503 once it is not.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, db]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  db: { type: string, enum: [ok, down, unconfigured] }
                  queueDepth:
                    type: integer
                    minimum: 0
                    description: Present only when the caller presents a device token.
        "503":
          description: The database is unreachable (`db` is `down`, `ok` is false)
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, db]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  db: { type: string, enum: [ok, down, unconfigured] }
                  queueDepth: { type: integer, minimum: 0 }
  /v1/version:
    get:
      summary: Build and protocol version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, protocol]
                properties:
                  version: { type: string }
                  protocol: { type: integer, enum: [1] }
  /v1/knowledge:
    get:
      summary: The versioned knowledge bundle
      description: |
        The catalog and prompt tables the app may use without a release. The
        body is the document reviewed at `contracts/knowledge/knowledge.v1.json`.
        `version` is a digest; `If-None-Match` with that version answers 304.
        A paired device token is required.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The bundle
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, version, catalog, sites, promptRules]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  version: { type: string }
                  catalog: { type: array, items: { type: object } }
                  sites: { type: array, items: { type: object } }
                  promptRules: { type: array, items: { type: object } }
        "304":
          description: The caller's copy is current
        "401":
          description: A paired device token is required
  /v1/models:
    get:
      summary: The on-device model manifest
      description: |
        The models this phone may download. The body is `models.v1.json` from the
        server's models directory, in the same shape the app already decodes;
        `version` is a digest of the entries, so `If-None-Match` with that value
        answers 304. A server with no directory configured answers an empty
        manifest, which is the app's local fallback. A paired device token is
        required.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The manifest
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelManifest" }
        "304":
          description: The caller's copy is current
        "401":
          description: A paired device token is required
  /v1/models/{id}:
    get:
      summary: One model file
      description: |
        Streams the GGUF weights of one entry of the manifest. `id` is the
        manifest id, not the file name. The `ETag` is the model's sha256, and
        `If-None-Match` with it answers 304. A paired device token is required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The model file
          headers:
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: The caller's copy is current
        "401":
          description: A paired device token is required
        "404":
          description: Unknown id, or no file behind it
  /v1/pair/sessions:
    post:
      summary: Mint a pairing session and its QR payload
      description: |
        Requires the operator bootstrap token (never a device token). The session
        is single use, expires in five minutes and is rate limited to five per
        minute per address.
      security:
        - bootstrapAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [householdName, memberName]
              properties:
                householdName: { type: string, minLength: 1, maxLength: 100 }
                memberName: { type: string, minLength: 1, maxLength: 100 }
                householdId:
                  type: string
                  nullable: true
                  description: Join an existing household (the second device). Omit to create one.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [session, qr, expiresAt]
                properties:
                  session: { type: string }
                  qr:
                    type: string
                    description: "hopa://pair?v=1&h=<household>&p=<session>&u=<wss url>"
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pair/claim:
    post:
      summary: Trade a pairing session for device tokens
      description: |
        Called by the new device. Resolves either an operator-minted pairing
        session or a pending session a phone vouched for. A vouched pending
        session requires the exact public key it was minted with and answers with
        the household key wrap parked on it plus the vouching phone's public key;
        other refusals name the session state. An operator-minted session answers
        neither `wrappedKey` nor `voucherPublicKey`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, platform, name, publicKey, alg]
              properties:
                session: { type: string }
                platform: { type: string, enum: [android, windows] }
                name: { type: string, minLength: 1, maxLength: 100 }
                publicKey: { type: string, description: Base64url, 32 bytes (X25519) }
                alg: { type: string, enum: [x25519] }
                pushToken: { type: string, nullable: true, maxLength: 4096 }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, householdId, accessToken, refreshToken, expiresAt]
                properties:
                  deviceId: { type: string }
                  householdId: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  wrappedKey:
                    type: string
                    description: |
                      Base64url of the 60-byte household key wrap this device was
                      admitted with. Present only for a session that came through
                      `/v1/pair/vouch`; omitted for an operator-minted session.
                  voucherPublicKey:
                    type: string
                    description: |
                      Base64url of the vouching phone's 32-byte X25519 public key,
                      needed to derive the same KEK as the wrap. Present exactly
                      when `wrappedKey` is; omitted for an operator-minted session.
        "400":
          description: |
            Expired, unvouched or already claimed session, a public key that does
            not match, or a vouched session whose voucher device/key is gone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/pair/pending:
    post:
      summary: Mint a pending pairing session for a device that wants to join
      description: |
        Unauthenticated. The new device mints its own session, shows the QR to the
        phone, then polls `/v1/pair/pending/resolve` with the secret. The secret
        leaves the server exactly once; only its SHA-256 is stored. Sessions expire
        in five minutes and minting is rate limited to five per minute per address
        (`X-Forwarded-For` first hop).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, name, publicKey, alg]
              properties:
                platform: { type: string, enum: [android, windows] }
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '\S'
                  description: Non-blank, at most 100 characters
                publicKey:
                  type: string
                  description: Base64 or base64url X25519 public key, exactly 32 bytes
                alg: { type: string, enum: [x25519] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, secret, qr, expiresAt]
                properties:
                  sessionId: { type: string, format: uuid }
                  secret:
                    type: string
                    description: Returned once; only its SHA-256 is stored.
                  qr:
                    type: string
                    description: "hopa://pair?v=1&s=<secret>&u=<wss url>; carries no household id"
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid platform, name, public key, algorithm or JSON body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429":
          description: More than five mints per minute from one address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/pair/pending/resolve:
    post:
      summary: Poll a pending pairing session by the secret from its QR
      description: |
        Unauthenticated. The poller holds only the secret, never a session id or a
        household, so the row is visible through the token-hash policy alone.
        Unknown secrets answer the same `E_SCHEMA` message; expired and claimed
        sessions answer 200 with that `state` so the device can explain it. Polling
        is rate limited to thirty per minute per address, which covers a five-second
        poll loop for the whole five-minute session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionSecret]
              properties:
                sessionSecret: { type: string }
      responses:
        "200":
          description: The session state
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, state, name, platform, publicKey, fingerprint, expiresAt]
                properties:
                  sessionId: { type: string, format: uuid }
                  state:
                    type: string
                    enum: [pending, vouched, claimed, expired]
                  name: { type: string }
                  platform: { type: string, enum: [android, windows] }
                  publicKey:
                    type: string
                    description: Base64url without padding, 32 bytes
                  fingerprint:
                    type: string
                    pattern: "^[0-9a-f]{8}$"
                    description: First 8 lowercase hex characters of SHA-256 over the raw public key
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Unknown pairing session, or an invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429":
          description: More than thirty polls per minute from one address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/pair/vouch:
    post:
      summary: Admit a pending pairing with a wrapped household key
      description: |
        Called by a phone that already belongs to the household. The body carries
        the pending session's secret and the household content key wrapped to the
        pending device's X25519 key (base64 or base64url, exactly 60 bytes:
        12-byte IV, 32-byte ciphertext, 16-byte tag). The server stores the
        ciphertext and never unwraps it. The wrap parks on the pending row until
        the device claims; the claim moves it to `household_key_wraps` in the same
        transaction that creates the device. Vouching is rate limited to ten per
        minute per device. Unknown, expired, claimed and already-vouched secrets
        answer the same `E_SCHEMA` message.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionSecret, wrappedKey]
              properties:
                sessionSecret: { type: string }
                wrappedKey:
                  type: string
                  description: Base64 or base64url of exactly 60 bytes
      responses:
        "200":
          description: Vouched
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, householdId, memberId]
                properties:
                  sessionId: { type: string, format: uuid }
                  householdId: { type: string, format: uuid }
                  memberId: { type: string, format: uuid }
        "400":
          description: Invalid wrap, or an unknown, expired or already vouched session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/accounts:
    post:
      summary: Sign up a phone-number account with a household of one
      description: |
        Creates an account, a household of one, the owner member and the phone's
        first device, all in one transaction, plus a household key wrap for that
        device. The phone is E.164-normalized server-side and is only a login
        lookup — it is never returned. Rate limited to five per minute per
        address and per phone. A phone that is already registered (live or
        deleted) answers the same uniform `E_AUTH` as a wrong password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, platform, name, publicKey, alg, selfWrappedKey]
              properties:
                phone: { type: string, description: E.164 phone number }
                password: { type: string }
                platform: { type: string, enum: [android, windows] }
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '\S'
                  description: Non-blank, at most 100 characters
                publicKey:
                  type: string
                  description: Base64 or base64url X25519 public key, exactly 32 bytes
                alg: { type: string, enum: [x25519] }
                selfWrappedKey:
                  type: string
                  description: Base64 or base64url household key wrap, 1 to 1024 bytes; the server stores the bytes and never unwraps them
                pushToken: { type: string, nullable: true, maxLength: 4096 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [accountId, deviceId, householdId, accessToken, refreshToken, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }
                  householdId: { type: string, format: uuid }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid phone, platform, name, public key, algorithm, wrap or JSON body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: The phone is already registered (`E_AUTH`, indistinguishable from a wrong password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session:
    post:
      summary: Sign in with a phone number and password
      description: |
        Creates a signed-in device for an existing account and returns its
        tokens. No household key wrap is written and no history is returned. The
        phone is only a login lookup and is never returned. A wrong phone and a
        wrong password answer the same `E_AUTH`. Rate limited to five per minute
        per address and per phone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, platform, name, publicKey]
              properties:
                phone: { type: string, description: E.164 phone number }
                password: { type: string }
                platform: { type: string, enum: [android, windows] }
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '\S'
                  description: Non-blank, at most 100 characters
                publicKey:
                  type: string
                  description: Base64 or base64url X25519 public key, exactly 32 bytes
                pushToken: { type: string, nullable: true, maxLength: 4096 }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [accountId, deviceId, householdId, accessToken, refreshToken, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }
                  householdId: { type: string, format: uuid }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid phone, platform, name, public key or JSON body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/otp:
    post:
      summary: Request a one-time SMS code
      description: |
        Mints a 6-digit single-use code and sends it to the phone. The phone is
        E.164-normalized server-side and is only a login lookup — it is never
        returned and never logged. The answer is always 202 with the same body
        whether or not the phone has an account, so the phone cannot be
        enumerated. When SMS is disabled (`HOPA_SMS_ENABLED` is not `true`) the
        route answers `E_UNSUPPORTED`. Rate limited to five per minute per
        address and per phone, and three codes per phone per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164 phone number }
      responses:
        "202":
          description: Accepted (whether or not the phone has an account)
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
        "400":
          description: Invalid phone or JSON body (`E_SCHEMA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: SMS OTP is not enabled on this deployment (`E_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/session/otp/verify:
    post:
      summary: Verify a one-time code and sign in
      description: |
        Verifies the code and, when it matches, signs in or provisions the
        account: an existing account (verified or not) binds to that account and
        signs in, and a phone with no account is provisioned on the spot. A
        wrong, expired or used code answers the same uniform `E_AUTH` as an
        unknown phone; a `deleted_at` account is refused, never resurrected. The
        device algorithm is always x25519. The phone is only a login lookup and
        is never returned. Rate limited to five per minute per address and per
        phone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, platform, name, publicKey]
              properties:
                phone: { type: string, description: E.164 phone number }
                code: { type: string, description: Six decimal digits }
                platform: { type: string, enum: [android, windows] }
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '\S'
                  description: Non-blank, at most 100 characters
                publicKey:
                  type: string
                  description: Base64 or base64url X25519 public key, exactly 32 bytes
                pushToken: { type: string, nullable: true, maxLength: 4096 }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [accountId, deviceId, householdId, accessToken, refreshToken, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }
                  householdId: { type: string, format: uuid }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid phone, code, platform, name, public key or JSON body (`E_SCHEMA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: SMS OTP is not enabled on this deployment (`E_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/token/refresh:
    post:
      summary: Rotate an access token
      description: A refresh token is single use. Presenting a rotated token revokes the device's token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresAt]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/devices:
    get:
      summary: The caller's paired devices
      description: |
        Every device in the caller's household, revoked ones included, ordered by
        creation time then id. `current` marks the device whose token made the
        call. Another household's devices never appear.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The household's devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, platform, name, current]
                  properties:
                    id: { type: string, format: uuid }
                    platform: { type: string, enum: [android, windows] }
                    name: { type: string }
                    lastSeenAt: { type: string, format: date-time, nullable: true }
                    revokedAt: { type: string, format: date-time, nullable: true }
                    current: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: This deployment has no SQL-backed device inventory (`E_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/devices/{id}:
    delete:
      summary: Revoke a device
      description: |
        Revokes the device and its whole token family, deletes its household key
        wrap and closes its live gateway socket within five seconds. Revoking an
        already-revoked device in the household answers 204.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked (or already revoked)
        "400":
          description: The id is not a uuid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown device, or one belonging to another household (`E_TENANT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: This deployment has no SQL-backed device inventory (`E_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/admin/devices:
    get:
      summary: A household's device inventory (admin console)
      description: |
        Requires an admin session token, never a device token. Lists every device
        in the named household, revoked ones included, with `online` reflecting
        the gateway registry on this process. It never returns tasks or turns.
      security:
        - adminBearerAuth: []
      parameters:
        - name: household
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The household's devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, platform, name, online]
                  properties:
                    id: { type: string, format: uuid }
                    platform: { type: string, enum: [android, windows] }
                    name: { type: string }
                    lastSeenAt: { type: string, format: date-time, nullable: true }
                    revokedAt: { type: string, format: date-time, nullable: true }
                    online: { type: boolean }
        "400":
          description: The household query parameter is missing or not a uuid (`E_SCHEMA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: This deployment has no SQL-backed device inventory (`E_UNSUPPORTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/admin/devices/{id}/diag:
    post:
      summary: Send one diagnostic task to a device (admin console)
      description: |
        Requires an admin session token. `household` is explicit and must own the
        device; a device in another household, an unknown device or a revoked one
        answers `E_TENANT` as 403 and writes no task. `type` is one of the three
        plaintext diagnostics; any other value, including `task.create`, is
        refused with `E_SCHEMA`. An online device receives the frame immediately
        (`state: delivered`); an offline one is queued and woken once through FCM
        (`state: queued`). Every send writes a `diag.send` audit event naming the
        admin, household, device, task and trace — never the body.
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [household, type]
              properties:
                household: { type: string, format: uuid }
                type:
                  type: string
                  enum: [diag.ping, diag.state, diag.reset]
                body:
                  type: object
                  description: Plaintext diagnostic payload, echoed to the device.
                  default: {}
      responses:
        "202":
          description: Task accepted (delivered now or queued for the next hello)
          content:
            application/json:
              schema:
                type: object
                required: [taskId, trace, state]
                properties:
                  taskId: { type: string, format: uuid }
                  trace: { type: string }
                  state: { type: string, enum: [delivered, queued] }
        "400":
          description: Invalid body, type, or device id (`E_SCHEMA`), or a queue refusal (`E_QUEUE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The device is unknown, revoked, or in another household (`E_TENANT`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /v1/admin/session:
    post:
      summary: Sign in to the admin console
      description: |
        Unauthenticated. Exchanges an admin email and password for an 8-hour
        opaque session token, stored only as SHA-256. An unknown email and a
        wrong password answer the same uniform `E_AUTH`; sign-in is rate limited
        to five per minute per address and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid JSON body or a blank email (`E_SCHEMA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/admin/households:
    get:
      summary: Look up a household by phone, member id or household id (admin console)
      description: |
        Requires an admin session token, never a device token. The `query` is an
        E.164 phone number, a member id or a household id; a uuid resolves as a
        member first, then as a household. A well-formed query with no match
        answers `[]`; a missing, blank or malformed query is `E_SCHEMA`. Every
        lookup writes an `admin.pii.read` access-log line (a hash of the query,
        never the raw phone or uuid) before any account read.
      security:
        - adminBearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The matching rows (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [householdId, memberId, displayName, verified, accountStatus]
                  properties:
                    householdId: { type: string, format: uuid }
                    memberId: { type: string, format: uuid }
                    displayName: { type: string }
                    phone: { type: string, nullable: true }
                    verified: { type: boolean }
                    accountStatus: { type: string, enum: [verified, unverified, none] }
        "400":
          description: The query is missing, blank or malformed (`E_SCHEMA`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/traces/{traceId}:
    get:
      summary: The path one message took, by trace id
      description: Scoped to the caller's household. Used by the operations console from week 2.
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: The spans, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [traceId, spans]
                properties:
                  traceId: { type: string }
                  spans:
                    type: array
                    items:
                      type: object
                      required: [operation, startedAt, durationMs, status]
                      properties:
                        operation: { type: string }
                        deviceId: { type: string, nullable: true }
                        taskId: { type: string, nullable: true }
                        startedAt: { type: string, format: date-time }
                        durationMs: { type: integer, minimum: 0 }
                        status: { type: string, enum: [ok, error] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown trace, or one belonging to another household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Device access token, 15 min, opaque.
    bootstrapAuth:
      type: http
      scheme: bearer
      description: Operator bootstrap token from the environment; creates pairing sessions only.
    adminBearerAuth:
      type: http
      scheme: bearer
      description: Admin console session token; never a device access token.
  schemas:
    ModelManifest:
      type: object
      required: [schemaVersion, version, models]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        version: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelSpec" }
    ModelSpec:
      type: object
      required:
        - id
        - name
        - modelClass
        - parameters
        - bytes
        - minRamGb
        - contextTokens
        - speedClass
        - license
      properties:
        id: { type: string }
        name: { type: string }
        modelClass:
          type: string
          enum: [ROUTER, FAST, BALANCED, TOOLS, LARGE, REASONING]
        file: { type: string }
        parameters: { type: string }
        quantization: { type: string }
        bytes: { type: integer, minimum: 0 }
        minRamGb: { type: integer, minimum: 0 }
        contextTokens: { type: integer, minimum: 1 }
        speedClass: { type: string }
        supportsTools: { type: boolean }
        thinking: { type: boolean }
        license: { type: string }
        licenseUrl: { type: string }
        url: { type: string }
        sha256: { type: string }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
        preferred: { type: boolean }
    Error:
      type: object
      required: [code, message, retryable, traceId]
      properties:
        code:
          type: string
          enum:
            - E_AUTH
            - E_TENANT
            - E_VERSION
            - E_RATE
            - E_QUEUE
            - E_SCHEMA
            - E_UNSUPPORTED
        message: { type: string }
        retryable: { type: boolean }
        messageKey: { type: string }
        traceId: { type: string }
  responses:
    Unauthorized:
      description: Missing, expired or revoked token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests in the window
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body is larger than the 64 KiB cap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
